<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  .topbar {
    padding: 16px 24px;
    border-bottom: 1px solid var(--shell-line);
    background: var(--shell-ink-1);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }
  .topbar-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #e7ebee;
  }
  .topbar-system {
    justify-self: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #8b98a3;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .topbar-system b { color: var(--topbar-accent); font-weight: 600; }
  .topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 16px; font-size: 13px; color: #8b98a3; }

  .topbar-clock {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.3;
    padding-right: 4px;
  }
  .topbar-clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--topbar-accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .topbar-clock-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #8b98a3;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* divider between clock and user chip */
  .topbar-divider {
    width: 1px;
    height: 24px;
    background: var(--shell-line);
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 4px 4px;
    border-radius: 12px;
    text-decoration: none;
    transition: background-color 0.15s ease;
  }
  .topbar-user:hover { background: var(--shell-ink-0); }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3ed6c4, #5b9dff);
    color: #0a0e12;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .user-meta { display: flex; flex-direction: column; line-height: 1.25; }
  .user-name {
    font-size: 12.5px;
    font-weight: 600;
    color: #e7ebee;
    white-space: nowrap;
  }
  .user-role {
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    color: #8b98a3;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
</style>

<div class="topbar">
  <div class="topbar-title">{{ page_title|default:"Dashboard" }}</div>

  <div class="topbar-system">Smart Computer<b> Lab Management System</b></div>

  <div class="topbar-right">

    <div class="topbar-clock" id="topbarClock">
      <span class="topbar-clock-time" id="topbarClockTime">--:--:--</span>
      <span class="topbar-clock-date" id="topbarClockDate">-- --- ----</span>
    </div>

    <div class="topbar-divider"></div>

    <a href="{% url 'profile' %}" class="topbar-user" title="My profile">
      <div class="avatar">
        {% if request.user.avatar %}
          <img src="{{ request.user.avatar.url }}" alt="">
        {% else %}
          {{ request.user.get_full_name|slice:":2"|upper }}
        {% endif %}
      </div>
      <div class="user-meta">
        <span class="user-name">{{ request.user.get_full_name|default:request.user.username }}</span>
        <span class="user-role">{{ request.user.role|default:"Admin" }}</span>
      </div>
    </a>

  </div>
</div>

<script>
(function() {
  var timeEl = document.getElementById('topbarClockTime');
  var dateEl = document.getElementById('topbarClockDate');
  if (!timeEl || !dateEl) return;

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function tick() {
    var now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    timeEl.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
    dateEl.textContent = pad(now.getDate()) + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
