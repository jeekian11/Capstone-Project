{% load static %}
<div class="notif-item {% if not notif.read %}unread{% endif %}">
  <div class="notif-body">
    <div class="notif-title">
      {% if notif.pinned %}
        <svg class="pin-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 3l5 5-4 4 1 6-5-4-6 6-1-1 6-6-4-5 6 1 2-6z"/>
        </svg>
      {% endif %}
      <span>{{ notif.title }}</span>
    </div>
    <div class="notif-message">{{ notif.message }}</div>
  </div>
  <div class="notif-meta">
    <span class="notif-time">{{ notif.created_at|timesince }} ago</span>
    {% if notif.user_id == request.user.id %}
    <div class="notif-menu">
      <button type="button" class="notif-menu-btn" onclick="notifMenuToggle(this)" aria-label="Notification options">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>
        </svg>
      </button>
      <div class="notif-menu-dropdown">
        <form method="post" action="{% url 'toggle_pin' notif.pk %}">
          {% csrf_token %}
          <button type="submit" class="notif-menu-item">
            {% if notif.pinned %}Unpin{% else %}Pin{% endif %}
          </button>
        </form>
        {% if not notif.read %}
          <form method="post" action="{% url 'mark_read' notif.pk %}">
            {% csrf_token %}
            <button type="submit" class="notif-menu-item">Mark as read</button>
          </form>
        {% endif %}
        <form method="post" action="{% url 'delete_notification' notif.pk %}"
              onsubmit="event.preventDefault(); compulabConfirmSubmit(this, {title: 'Delete this notification?', text: 'This cannot be undone.', icon: 'warning', confirmButtonText: 'Yes, delete', confirmButtonColor: '#ff5d5d'}); return false;">
          {% csrf_token %}
          <button type="submit" class="notif-menu-item danger">Delete</button>
        </form>
      </div>
    </div>
    {% endif %}
  </div>
</div>
