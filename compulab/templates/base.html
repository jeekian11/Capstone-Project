<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompuLab — {% block title %}Dashboard{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: sans-serif; background: #f1f0e8; color: #2c2c2a; }

    :root{
      --topbar-accent: #3ed6c4;
      --topbar-accent-tint: rgba(62,214,196,0.12);
      --topbar-ink-1: #12171d;
      --topbar-text-1: #4d5761;
      --topbar-text-2: #8b98a3;
    }

    .app { display: flex; height: 100vh; }

    .sidebar { flex-shrink: 0; display: flex; flex-direction: column; height: 100%; min-height: 0; }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .metric { background: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px; }
    .metric-label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .metric-val { font-size: 24px; font-weight: 500; }
    .metric-val.green { color: #3B6D11; }
    .metric-val.red { color: #E24B4A; }
    .metric-val.amber { color: #BA7517; }
    .card { background: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .section-title { font-size: 13px; font-weight: 500; margin-bottom: 12px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { text-align: left; padding: 6px 8px; color: #888; font-weight: 500; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
    .table td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
    .table tr:last-child td { border-bottom: none; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    .pill-green { background: #EAF3DE; color: #3B6D11; }
    .pill-red { background: #FCEBEB; color: #E24B4A; }
    .pill-amber { background: #FAEEDA; color: #BA7517; }
    .pill-blue { background: var(--topbar-accent-tint); color: var(--topbar-ink-1); }
    .btn-primary { background: var(--topbar-accent); color: var(--topbar-ink-1); border-color: var(--topbar-accent); font-weight: 600; }
    .btn-primary:hover { background: var(--topbar-accent); opacity: 0.85; }
    .schedule-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .schedule-row:last-child { border: none; }
    .schedule-time { font-size: 11px; color: #888; width: 80px; flex-shrink: 0; padding-top: 4px; }
    .schedule-block { flex: 1; background: var(--topbar-accent-tint); border-left: 3px solid var(--topbar-accent); border-radius: 4px; padding: 6px 10px; }
    .schedule-block.free { background: #f5f5f5; border-left-color: #ccc; }
    .s-title { font-size: 12px; font-weight: 500; }
    .s-sub { font-size: 11px; color: #666; }
    .messages { margin-bottom: 14px; }
    .message { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }
    .message.success { background: #EAF3DE; color: #3B6D11; }
    .message.error { background: #FCEBEB; color: #E24B4A; }
    .message.warning { background: #FAEEDA; color: #BA7517; }
    a { color: inherit; }

    /* shared components used across app pages */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 20px; font-weight: 600; }
    .page-header .sub { font-size: 13px; color: #888; margin-top: 2px; }

    .action-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid #d8d8d8; background: #fff; color: #2c2c2a; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; }
    .action-btn:hover { border-color: #b8b8b8; }
    .action-btn.primary { background: var(--topbar-accent); border-color: var(--topbar-accent); color: var(--topbar-ink-1); font-weight: 600; }
    .action-btn.primary:hover { opacity: 0.85; }
    .action-btn.danger { background: #FCEBEB; border-color: #f3c9c9; color: #E24B4A; }
    .action-btn.small { padding: 5px 12px; font-size: 12px; }

    .status-pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; text-transform: capitalize; }
    .pill-open, .pill-pending, .pill-offline, .pill-faulty, .pill-high, .pill-delete { background: #FCEBEB; color: #E24B4A; }
    .pill-in_progress, .pill-in_use, .pill-needs_check, .pill-medium, .pill-issue, .pill-deactivate, .pill-under_repair { background: #FAEEDA; color: #BA7517; }
    .pill-assigned { background: var(--topbar-accent-tint); color: var(--topbar-ink-1); }
    .pill-resolved, .pill-approved, .pill-online, .pill-good, .pill-low, .pill-activate, .pill-register, .pill-operational { background: #EAF3DE; color: #3B6D11; }
    .pill-declined, .pill-retired { background: #ececec; color: #666; }
    .pill-admin, .pill-incharge, .pill-instructor, .pill-student, .pill-fair, .pill-reset_password, .pill-pc_unlock { background: var(--topbar-accent-tint); color: var(--topbar-ink-1); }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: #666; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 9px 12px; border: 1px solid #d8d8d8; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff; color: #2c2c2a; }
    .form-control:focus { outline: none; border-color: var(--topbar-accent); }
    /* fallback: Django's auto-generated widgets don't carry the form-control class */
    .card form input[type="text"], .card form input[type="email"], .card form input[type="password"],
    .card form input[type="number"], .card form input[type="date"], .card form input[type="time"],
    .card form select, .card form textarea {
      width: 100%; padding: 9px 12px; border: 1px solid #d8d8d8; border-radius: 8px;
      font-size: 13px; font-family: inherit; background: #fff; color: #2c2c2a;
    }
    .card form input[type="checkbox"] { margin-right: 6px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; }
    .form-errors { color: #E24B4A; font-size: 12px; margin-top: 4px; }
    .helptext { font-size: 11px; color: #999; margin-top: 4px; display: block; }

    .empty { color: #999; font-size: 13px; text-align: center; padding: 24px 0; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .toolbar-stats { display: flex; gap: 18px; font-size: 12px; color: #888; }
    .toolbar-stats b { color: #2c2c2a; font-size: 14px; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    {% include "dashboard/sidebar.html" %}
  </aside>

  <div class="main">
    {% include "dashboard/navbar.html" %}

    <div class="content">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}

      {% include "dashboard/footer.html" %}
    </div>
  </div>
</div>
</body>
</html>
